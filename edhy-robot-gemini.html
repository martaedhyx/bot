<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edhy Robot · Gemini</title>
<style>
:root{color-scheme:dark;--bg:#131313;--panel:#1f1f1d;--line:#34332f;--fg:#eceae3;--muted:#aaa69c;--accent:#e0825e}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}header img{width:48px;height:48px;object-fit:contain;animation:float 3s ease-in-out infinite}h1{font-size:18px;margin:0;font-weight:600}small{display:block;color:var(--muted);font-size:12px;font-weight:400}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px 4px}.welcome{text-align:center;margin:auto;color:var(--muted)}.welcome img{width:min(180px,55vw);display:block;margin:0 auto 12px;animation:float 3s ease-in-out infinite}.welcome b{display:block;color:var(--fg);font-size:20px}.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#30302c}.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.error{color:#ff928a;border:1px solid #ff928a}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 0}textarea{font:inherit;flex:1;min-width:0;resize:none;max-height:140px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);padding:11px}button{font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:10px 12px;cursor:pointer}button.primary{background:var(--fg);color:var(--bg)}button:disabled{opacity:.5}
#settings{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center}#settings .panel{width:100%;max-width:760px;background:var(--panel);border-radius:20px 20px 0 0;padding:20px;max-height:90%;overflow:auto}label{display:block;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<header><img src="https://raw.githubusercontent.com/martaedhyx/hyper-direct/main/IMG_0516.png" alt="Edhy Robot"><div><h1>Edhy Robot</h1><small id="modelLabel">Gemini AI</small></div><span style="flex:1"></span><button id="settingsBtn" type="button">Pengaturan</button><button id="clearBtn" type="button">Hapus</button></header>
<main id="chat" aria-live="polite"></main>
<form id="form"><textarea id="text" rows="1" placeholder="Tanya apa saja kepada Edhy..." aria-label="Pesan"></textarea><button id="sendBtn" class="primary" type="submit">Kirim</button></form>
<div id="settings"><div class="panel"><h2>Pengaturan Edhy</h2><label for="key">API key Gemini</label><input id="key" type="password" autocomplete="off" placeholder="Tempel API key Gemini"><label for="model">Model Gemini</label><input id="model" value="gemini-2.5-flash" list="models"><datalist id="models"><option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"></datalist><label for="sys">Kepribadian Edhy</label><textarea id="sys" rows="3">Kamu adalah Edhy Robot, asisten AI yang ramah dan membantu. Jawab dalam bahasa Indonesia dengan jelas dan jujur. Jika tidak tahu, katakan terus terang.</textarea><div class="actions"><button id="cancelBtn" type="button">Batal</button><button id="saveBtn" class="primary" type="button">Simpan</button></div><small>API key disimpan di browser ini. Jangan masukkan key ke komputer/perangkat umum.</small></div></div>
<script>
(function(){
const $=id=>document.getElementById(id), chat=$('chat');let history=[];let busy=false;
const load=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let cfg={key:load('edhy_gem_key',''),model:load('edhy_gem_model','gemini-2.5-flash'),sys:load('edhy_gem_sys','Kamu adalah Edhy Robot, asisten AI yang ramah dan membantu. Jawab dalam bahasa Indonesia dengan jelas dan jujur. Jika tidak tahu, katakan terus terang.')};
try{history=JSON.parse(load('edhy_gem_hist','[]'))||[]}catch(e){}
function add(role,content,cls){const d=document.createElement('div');d.className='msg '+(cls||role);d.textContent=content;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function render(){chat.textContent='';$('modelLabel').textContent=cfg.model;if(!history.length){const w=document.createElement('div');w.className='welcome';const img=document.createElement('img');img.src='https://raw.githubusercontent.com/martaedhyx/hyper-direct/main/IMG_0516.png';img.alt='Edhy Robot';const b=document.createElement('b');b.textContent='Halo, Mas! Aku Edhy Robot.';const p=document.createElement('div');p.textContent=cfg.key?'Tanyakan apa saja untuk mulai.':'Buka Pengaturan dan masukkan API key Gemini.';w.append(img,b,p);chat.appendChild(w);return}history.forEach(m=>add(m.role==='user'?'user':'bot',m.parts[0].text))}
function openSettings(){ $('key').value=cfg.key;$('model').value=cfg.model;$('sys').value=cfg.sys;$('settings').style.display='flex'}
async function send(){const q=$('text').value.trim();if(!q||busy)return;if(!cfg.key){openSettings();return}busy=true;$('sendBtn').disabled=true;$('text').value='';history.push({role:'user',parts:[{text:q}]});render();const wait=add('bot','Edhy sedang berpikir…');
try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(cfg.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({system_instruction:{parts:[{text:cfg.sys}]},contents:history})});const d=await r.json().catch(()=>({}));if(!r.ok){history.pop();render();add('bot',r.status===429?'Batas penggunaan Gemini tercapai. Coba lagi nanti.':'Gemini gagal ('+r.status+'): '+(d.error?.message||'Periksa API key dan nama model.'),'error');$('text').value=q}else{const answer=d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'Edhy belum mendapatkan jawaban.';history.push({role:'model',parts:[{text:answer}]});save('edhy_gem_hist',JSON.stringify(history));render()}}catch(e){history.pop();render();add('bot','Tidak bisa terhubung ke Gemini. Periksa koneksi internet.','error');$('text').value=q}finally{busy=false;$('sendBtn').disabled=false;$('text').focus()}}
$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});$('text').addEventListener('input',()=>{$('text').style.height='auto';$('text').style.height=Math.min($('text').scrollHeight,140)+'px'});$('settingsBtn').onclick=openSettings;$('cancelBtn').onclick=()=>$('settings').style.display='none';$('saveBtn').onclick=()=>{cfg.key=$('key').value.trim();cfg.model=$('model').value.trim()||'gemini-2.5-flash';cfg.sys=$('sys').value.trim()||'Kamu adalah Edhy Robot, asisten AI yang ramah dan membantu.';save('edhy_gem_key',cfg.key);save('edhy_gem_model',cfg.model);save('edhy_gem_sys',cfg.sys);$('settings').style.display='none';render()};$('clearBtn').onclick=()=>{if(confirm('Hapus semua percakapan Edhy?')){history=[];save('edhy_gem_hist','[]');render()}};render();if(!cfg.key)openSettings();
})();
</script>
</body>
</html>
