    b2.addEventListener("click", function () {
      var t = out.textContent;
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Jawaban disalin"); }, function () { toast("Tidak bisa menyalin di sini. Tahan teks untuk memilih."); });
    });
    row.appendChild(b1); row.appendChild(b2);
    if (navigator.share) {
      var b3 = mk("button", "mini", "Bagikan"); b3.type = "button";
      b3.addEventListener("click", function () { navigator.share({ title: "martaedhyx", text: out.textContent }).catch(function () {}); });
      row.appendChild(b3);
    }
    box.appendChild(row);
  }

  function blobToDataURL(b) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(b); });
  }

  function askAI(q, out, box, signal, pool, att, ex) {
    var lab = box.querySelector(".lab"), ctx = pool.slice(0, 30);
    var prompt = aiPrompt(q, ctx, { place: att.place, files: att.files, page: ex.page, nimg: att.images.length });
    out.textContent = "Menyusun jawaban…";
    function viaProviders() {
      return Promise.all(att.images.map(function (im) { return blobToDataURL(im.blob); })).then(function (urls) {
        return raceProviders(prompt, signal, urls);
      }).then(function (r) { out.textContent = r.text; lab.textContent = "Jawaban AI · " + r.name; });
    }
    return getSample().then(function (sample) {
      if (!sample) return viaProviders();
      var canImg = sample.limits ? sample.limits().then(function (l) { return !!(l && l.images); }, function () { return false; }) : Promise.resolve(false);
      return canImg.then(function (ok) {
        if (att.images.length && !ok) return viaProviders();
        var opts = { modelTier: "quick", cache: false, signal: signal, onText: function (t) { out.textContent = t.text; } };
        if (att.images.length) opts.images = att.images.map(function (im) { return im.blob; });
        return sample(prompt, opts).then(function (r) { if (r && r.text) out.textContent = r.text; })
          .catch(function (e) { if (signal.aborted) throw e; return viaProviders(); });
      });
    }).then(function () { addCites(box, ctx); addActions(box, out); }).catch(function () {
      if (signal.aborted) return;
      out.textContent = "Jawaban AI belum bisa dibuat. Periksa koneksi, atau tempel kunci gratis lewat tombol + lalu coba lagi.";
      addCites(box, ctx);
    });
  }

  /* ---------- Lampiran: kamera, galeri, berkas, lokasi ---------- */
  function renderTray() {
    var t = $("tray"); t.textContent = "";
    state.images.forEach(function (im, i) {
      var w = mk("span", "att photo"), img = mk("img"), x = mk("button", "x", "\u00D7");
      img.src = im.url; img.alt = "Foto " + (i + 1);
      x.type = "button"; x.setAttribute("aria-label", "Hapus foto " + (i + 1));
      x.addEventListener("click", function () { state.images.splice(i, 1); renderTray(); });
      w.appendChild(img); w.appendChild(x); t.appendChild(w);
    });
    state.files.forEach(function (f, i) {
      var w = mk("span", "att"), x = mk("button", "x", "\u00D7");
      x.type = "button"; x.setAttribute("aria-label", "Hapus berkas " + f.name);
      x.addEventListener("click", function () { state.files.splice(i, 1); renderTray(); });
      w.appendChild(mk("span", "", "Berkas: " + f.name)); w.appendChild(x); t.appendChild(w);
    });
    if (state.place) {
      var w = mk("span", "att"), x = mk("button", "x", "\u00D7");
      x.type = "button"; x.setAttribute("aria-label", "Hapus lokasi");
      x.addEventListener("click", function () { state.place = null; renderTray(); });
      w.appendChild(mk("span", "", "Lokasi: " + state.place.label)); w.appendChild(x); t.appendChild(w);
    }
    t.hidden = !(state.images.length || state.files.length || state.place);
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(u);
        var r = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { b ? res(b) : rej(new Error("gagal")); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(u); rej(new Error("gambar")); };
      img.src = u;
    });
  }
  function addImages(list) {
    var arr = Array.prototype.slice.call(list || []).filter(function (f) { return /^image\//.test(f.type); });
    if (!arr.length) return;
    var room = 4 - state.images.length;
    if (room <= 0) { toast("Maksimal 4 foto"); return; }
    arr.slice(0, room).reduce(function (p, f) {
      return p.then(function () {
        return shrink(f).then(function (b) { state.images.push({ blob: b, url: URL.createObjectURL(b) }); renderTray(); }, function () { toast("Foto tidak bisa dibaca"); });
      });
    }, Promise.resolve());
  }
  function addTextFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { state.files.push({ name: f.name, text: String(r.result || "").slice(0, 8000) }); renderTray(); };
    r.onerror = function () { toast("Berkas tidak bisa dibaca"); };
    r.readAsText(f);
  }
  function getPlace() {
    if (!navigator.geolocation) { toast("Lokasi tidak didukung di peramban ini"); return; }
    toast("Meminta izin lokasi…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      state.place = { lat: lat, lon: lon, label: lat.toFixed(3) + ", " + lon.toFixed(3) }; renderTray(); toast("Lokasi dibagikan");
      J("https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&accept-language=id&lat=" + lat + "&lon=" + lon).then(function (d) {
        if (d && d.display_name && state.place) { state.place.label = d.display_name.split(",").slice(0, 3).join(",").trim(); renderTray(); }
      }).catch(function () {});
    }, function (err) {
      toast(err && err.code === 1 ? "Izin lokasi ditolak. Aktifkan di pengaturan peramban, atau buka versi GitHub Pages." : "Lokasi tidak bisa dibaca");
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  }
  function openMenu() {
    var p = $("sheetPanel"); p.textContent = "";
    p.appendChild(mk("h2", "", "Tambah ke pencarian"));
    function item(label, sub, fn) {
      var b = mk("button", "mi"); b.type = "button"; b.appendChild(mk("b", "", label)); b.appendChild(mk("small", "", sub));
      b.addEventListener("click", function () { closeLayers(); fn(); }); p.appendChild(b);
    }
    item("Ambil foto", "Buka kamera lalu tanyakan isinya", function () { $("camInput").click(); });
    item("Pilih dari galeri", "Sampai 4 foto sekaligus", function () { $("galInput").click(); });
    item("Lampirkan berkas teks", "txt, md, csv, atau json", function () { $("fileInput").click(); });
    item("Bagikan lokasi saya", "Untuk cuaca dan tempat di sekitarmu", getPlace);
    item("Sumber dan mesin AI", "Pilih sumber, tempel kunci gratis", openSheet);
    p.appendChild(mk("div", "none", "Foto, berkas, dan lokasi hanya dikirim saat kamu menekan cari, ke mesin AI yang dipakai. Tempel alamat web di kotak cari untuk meringkas halamannya."));
    openLayer("sheet");
  }
  $("camInput").addEventListener("change", function (e) { addImages(e.target.files); e.target.value = ""; });
  $("galInput").addEventListener("change", function (e) { addImages(e.target.files); e.target.value = ""; });
  $("fileInput").addEventListener("change", function (e) { addTextFile(e.target.files[0]); e.target.value = ""; });
  $("q").addEventListener("paste", function (e) {
    var items = (e.clipboardData && e.clipboardData.files) || [];
    if (items.length) { var imgs = Array.prototype.filter.call(items, function (f) { return /^image\//.test(f.type); }); if (imgs.length) { e.preventDefault(); addImages(imgs); } }
  });

  /* ---------- Suara ---------- */
  (function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = $("micBtn"), rec = null, base = "";
    if (!SR) { btn.hidden = true; return; }
    btn.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "id-ID"; rec.interimResults = true; rec.continuous = false;
      base = $("q").value ? $("q").value.replace(/\s*$/, " ") : "";
      rec.onresult = function (e) {
        var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        $("q").value = base + t; autosize();
      };
      rec.onerror = function (e) { toast(e && (e.error === "not-allowed" || e.error === "service-not-allowed") ? "Izin mikrofon ditolak" : "Suara tidak terbaca"); };
      rec.onend = function () { rec = null; btn.setAttribute("aria-pressed", "false"); };
      try { rec.start(); btn.setAttribute("aria-pressed", "true"); toast("Silakan bicara…"); } catch (err) { rec = null; }
    });
  })();

  /* ---------- Pencarian ---------- */
  function search(q) {
    var typed = String(q || "").trim(), hasAtt = state.images.length || state.files.length;
    if (!typed && !hasAtt) { toast("Tulis kata kunci dulu"); return; }
    q = typed || (state.images.length ? "Jelaskan isi foto ini." : "Ringkas isi berkas ini.");
    var um = typed.match(urlRe), urlInQ = um ? um[0] : "", sq = urlInQ ? typed.replace(urlInQ, "").trim() : typed;
    var place = state.place;
    var chosen = sq ? LIVE.filter(function (s) { return prefs.sources.indexOf(s.id) >= 0 && (!s.needs || place); }) : [];
    if (!chosen.length && !prefs.ai && !urlInQ) { toast("Pilih minimal satu sumber"); openSheet(); return; }
    if (ctrl) ctrl.abort(); if (aiCtrl) aiCtrl.abort();
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    ctrl = new AbortController(); aiCtrl = new AbortController();
    var myCtrl = ctrl, ex = { page: "" };
    if (typed) remember(typed);
    if (urlInQ) {
      chosen.unshift({ id: "page", name: "Halaman web", run: function (_q, sig) {
        return fetch("https://r.jina.ai/" + urlInQ, { signal: sig }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(function (t) {
          ex.page = t.slice(0, 7000);
          var m = t.match(/^Title:\s*(.+)$/m);
          return [{ title: m ? m[1].trim() : urlInQ, meta: t.replace(/^(Title|URL Source|Markdown Content):.*$/gm, "").replace(/\s+/g, " ").trim().slice(0, 200), url: urlInQ }];
        });
      } });
    }

    var att = { images: state.images.slice(), files: state.files.slice(), place: place };
    state.images = []; state.files = []; renderTray();

    $("empty").hidden = true;
    var t = $("thread"); t.hidden = false; t.textContent = "";
    t.appendChild(mk("div", "qb", q));
    if (att.images.length) {
      var th = mk("div", "thumbs");
      att.images.forEach(function (im) { var i = mk("img"); i.src = im.url; i.alt = "Foto terlampir"; th.appendChild(i); });
      t.appendChild(th);
    }
    if (att.files.length) t.appendChild(mk("div", "meta", "Berkas: " + att.files.map(function (f) { return f.name; }).join(", ")));
    if (place) t.appendChild(mk("div", "meta", "Lokasi: " + place.label));

    var aiBox = null, aiOut = null;
    if (prefs.ai) {
      aiBox = mk("div", "ai"); aiBox.appendChild(mk("div", "lab", "Jawaban AI")); aiOut = mk("div", "out"); aiBox.appendChild(aiOut); t.appendChild(aiBox);
    }
    var banner = mk("div", "banner"); banner.hidden = true; t.appendChild(banner);

    var nodes = {};
    chosen.forEach(function (s) {
      var g = mk("section", "grp"), h = mk("div", "gh"), st = mk("span", "", "Mencari…");
      h.appendChild(mk("b", "", s.name)); h.appendChild(st); g.appendChild(h);
      t.appendChild(g); nodes[s.id] = { g: g, st: st };
    });
    t.appendChild(linkBlock(sq || q));
    $("stage").scrollTop = 0;

    var pool = [], aiStarted = false, mySig = aiCtrl.signal;
    function startAI() { if (!aiBox || aiStarted || mySig.aborted) return; aiStarted = true; askAI(q, aiOut, aiBox, mySig, pool, att, ex); }
    if (aiBox) { if (!chosen.length) startAI(); else setTimeout(startAI, 3500); }

    var done = 0, ok = 0, timer = setTimeout(function () { myCtrl.abort(); }, 9000);
    function finish() {
      done++; if (done < chosen.length) return;
      clearTimeout(timer);
      startAI();
      if (chosen.length && ok === 0) {
        banner.hidden = false;
        banner.textContent = "Pencarian langsung tidak bisa tersambung dari halaman ini. Pakai tombol \u201CBuka hasil lengkap di situs sumber\u201D di bawah untuk melihat hasilnya di situsnya.";
      }
    }
    chosen.forEach(function (s) {
      var n = nodes[s.id];
      s.run(sq || q, myCtrl.signal, place).then(function (items) {
        ok++;
        items = (items || []).filter(function (x) { return x && x.title && safeUrl(x.url); });
        items.slice(0, 3).forEach(function (x) { pool.push({ src: s.name, title: x.title, meta: x.meta, url: x.url }); });
        n.st.textContent = items.length ? items.length + " hasil" : "Tidak ada hasil";
        items.forEach(function (x) {
          var a = mk("a", "hit"); a.href = safeUrl(x.url); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.appendChild(mk("b", "", x.title));
          if (x.meta) a.appendChild(mk("small", "", x.meta));
          n.g.appendChild(a);
        });
      }).catch(function (e) {
        n.st.textContent = e && e.name === "AbortError" ? "Terlalu lama" : "Tidak tersambung";
      }).then(finish);
    });
    if (!chosen.length) finish();
  }

  /* ---------- Kotak cari ---------- */
  function autosize() { var q = $("q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; }
  $("q").addEventListener("input", autosize);
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); search($("q").value); });
  autosize();
})();
</script>
